services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snoopify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snoopify}
      POSTGRES_DB: ${POSTGRES_DB:-snoopify}
    ports:
      - "5432:5432"
    volumes:
      - snoopify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snoopify}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"  # dev only — remove --reload for production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-snoopify}:${POSTGRES_PASSWORD:-snoopify}@db:5432/${POSTGRES_DB:-snoopify}
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: '["http://localhost:3000"]'
      REDIS_URL: "redis://redis:6379/0"
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  snoopify_pgdata:
